<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeckRemote Key Block Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #2d2d2d;
            color: #d4d4d4;
        }
        
        .sdpi-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .sdpi-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-size: 12px;
            font-weight: 500;
            color: #9d9d9d;
        }
        
        input, select {
            padding: 8px;
            background-color: #3c3c3c;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #d4d4d4;
            font-size: 13px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #0e639c;
        }
        
        .info {
            font-size: 11px;
            color: #858585;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="sdpi-item">
            <label for="serverUrl">Windows PC Server URL</label>
            <input type="text" id="serverUrl" placeholder="http://192.168.1.100:7394">
            <div class="info">The URL of the DeckRemote service running on your Windows PC</div>
        </div>
        
        <div class="sdpi-item">
            <label for="key">Key to Block</label>
            <select id="key">
                <option value="LWIN">Left Windows Key</option>
                <option value="RWIN">Right Windows Key</option>
                <option value="APPS">Applications Key</option>
            </select>
            <div class="info">Select which key to block when toggled</div>
        </div>
    </div>

    <script>
        let websocket = null;
        let pluginUUID = null;
        let actionInfo = {};

        function connectElgatoStreamDeckSocket(inPort, inPluginUUID, inRegisterEvent, inInfo, inActionInfo) {
            pluginUUID = inPluginUUID;
            actionInfo = JSON.parse(inActionInfo);
            
            websocket = new WebSocket(`ws://localhost:${inPort}`);
            
            websocket.onopen = function() {
                const json = {
                    event: inRegisterEvent,
                    uuid: inPluginUUID
                };
                websocket.send(JSON.stringify(json));
                
                // Load current settings
                const settings = actionInfo.payload.settings;
                if (settings.serverUrl) {
                    document.getElementById('serverUrl').value = settings.serverUrl;
                }
                if (settings.key) {
                    document.getElementById('key').value = settings.key;
                }
            };
        }

        function sendSettings() {
            if (websocket && websocket.readyState === 1) {
                const settings = {
                    serverUrl: document.getElementById('serverUrl').value,
                    key: document.getElementById('key').value
                };
                
                const json = {
                    event: 'setSettings',
                    context: actionInfo.context,
                    payload: settings
                };
                
                websocket.send(JSON.stringify(json));
            }
        }

        // Add event listeners
        document.getElementById('serverUrl').addEventListener('input', sendSettings);
        document.getElementById('key').addEventListener('change', sendSettings);
    </script>
</body>
</html>
